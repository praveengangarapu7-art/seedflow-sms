services:
  postgres:
    image: postgres:16-alpine
    container_name: seedflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seedflow
      POSTGRES_PASSWORD: seedflow
      POSTGRES_DB: seedflow
    ports:
      - "5433:5432"
    volumes:
      - seedflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedflow -d seedflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seedflow_pg_data:
